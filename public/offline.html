<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Bloomprint offline</title>
    <style>
      :root {
        color-scheme: light dark;
        --background: #f8f3ea;
        --surface: #fffdf7;
        --foreground: #18231d;
        --muted: #6f6a5f;
        --border: #d9cebd;
        --brand: #244735;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --background: #0e1511;
          --surface: #151f19;
          --foreground: #f4efe6;
          --muted: #b7b1a6;
          --border: #2c3a30;
          --brand: #9fceaa;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--background);
        color: var(--foreground);
        font-family: Inter, system-ui, sans-serif;
      }
      main {
        max-width: 420px;
        border: 1px solid var(--border);
        border-radius: 20px;
        background: var(--surface);
        padding: 24px;
        box-shadow: 0 18px 40px rgb(0 0 0 / 0.08);
      }
      h1 {
        margin: 0;
        font-size: 1.5rem;
      }
      p {
        color: var(--muted);
        line-height: 1.5;
      }
      a {
        color: var(--brand);
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Bloomprint is offline</h1>
      <p>
        Your saved drafts and plans still live on this device. Reconnect to generate new plans, sync
        cloud data, or check live references.
      </p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
